<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>智能反色 · 设置</title>
  <style>
    /* 构建时由 scripts/build-extension.js 从用户脚本的 v6.4-TOKENS-START/END 块逐字注入。
       绝不要在这里手写颜色 —— 三处 token 的逐字节一致性由 test.js 把关。 */
    /* SVI_TOKEN_INJECT */
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--svi-bg);
      color: var(--svi-text-strong);
      font: var(--svi-fs-lg)/var(--svi-lh) system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
      padding: var(--svi-gap) calc(var(--svi-gap) * 2);
    }
    header { display: flex; align-items: baseline; gap: var(--svi-gap-sm); padding: var(--svi-gap) 0; border-bottom: var(--svi-border-w) solid var(--svi-border); }
    header h1 { font-size: var(--svi-fs-lg); color: var(--svi-title); font-weight: 600; }
    header .ver { color: var(--svi-text-dim); font-size: var(--svi-fs-sm); }
    main { padding: var(--svi-gap) 0; color: var(--svi-fg); }
    .svi-note { border: var(--svi-border-w) solid var(--svi-border); border-radius: var(--svi-r); padding: var(--svi-gap-sm); margin-top: var(--svi-gap); color: var(--svi-text-dim); font-size: var(--svi-fs-sm); }
  </style>
</head>
<body>
  <header>
    <h1>智能反色 · 设置</h1>
    <span class="ver" id="ver"></span>
  </header>
  <main id="svi-options-root">
    <!-- v6.4 重建层在此挂载全部设置区块 (12 个区块, 与内嵌面板同源控件库与 token) -->
  </main>
  <div class="svi-note">
    本页与用户脚本内嵌面板、扩展弹窗共用同一份设计 token(构建时注入)与同一套控件库。
    设置项与偏好键与内嵌面板完全一致 —— 任一处修改, 另一处刷新即见。
  </div>
  <script src="options.js"></script>
</body>
</html>
